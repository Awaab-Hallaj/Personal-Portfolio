<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tablet.css" media="screen and (min-width: 480px) and (max-width: 960px)">
    <link rel="stylesheet" href="mobile.css" media="screen and (max-width: 479px)">
    <link rel="stylesheet" href="laptop.css" media="screen and (min-width: 961px)">
</head>

<body>

    <header id="banner">
        <h1>Contact Me</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about-me.html">About Me</a>
            <a href="projects.html">Projects</a>
            <a class="selected" href="contact.html">Contact</a>
        </nav>
    </header>

    <main id="wrapper">
        <h2>Send a Message</h2>
        <p>Fill out the form below.</p>

        <form action="mailto:muhammad.hallaj@ontariotechu.net" method="post" enctype="text/plain">

            <label for="name">Name:</label>
            <input type="text" id="name" name="Name" required minlength="2">

            <label for="email">Email:</label>
            <input type="email" id="email" name="Email" required>

            <label for="cell">Cell Number:</label>
            <input type="tel" id="cell" name="Cell Number" required pattern="[0-9()+ .-]{7,20}"
                title="Enter a valid phone number">

            <label for="comments">Comments:</label>
            <textarea id="comments" name="Comments" rows="5" required minlength="5"></textarea>

            <input type="submit" value="Submit">

        </form>
    </main>

    <footer id="footer">
        <p>Email: muhammad.hallaj@ontariotechu.net</p>
        <p>&copy; 2026 Awaab Hallaj</p>
    </footer>

</body>

</html>
